name: python-smoke

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so a new NumPy release that removes an API turns this red
    # even when nobody has pushed.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install current NumPy / matplotlib (unpinned on purpose)
        run: python -m pip install --upgrade numpy matplotlib pytest
      - name: Show versions
        run: python -c "import numpy, matplotlib; print('numpy', numpy.__version__, 'matplotlib', matplotlib.__version__)"
      - name: Run smoke tests
        run: python -m pytest -q tests
